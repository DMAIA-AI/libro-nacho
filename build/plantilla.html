<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nacho Lee — Aprendo a leer por sílabas</title>

<style>
  :root{
    color-scheme: light;
    --coco:#FFF4E2; --coco-2:#FFE7C6; --papel:#FFFFFF; --arena:#E7D6BB;
    --tinta:#3A2350; --tinta-suave:#6D5780;
    --mango:#FF8A24; --guayaba:#FF3F87; --mar:#12B3C4; --limon:#FFC61A;
    --hoja:#38A85C; --uva:#8A5CF0; --ok:#2FA968; --no:#E3564A;
    --acento:#FF3F87;
    --display:"Century Gothic","Futura","Avenir Next","Trebuchet MS","Segoe UI",sans-serif;
    --ui:"Trebuchet MS","Segoe UI",Tahoma,sans-serif;
    --r-xl:34px; --r-l:24px; --r-m:16px;
    --sombra:0 8px 0 rgba(58,35,80,.15), 0 18px 30px rgba(58,35,80,.10);
    --sombra-p:0 5px 0 rgba(58,35,80,.18);
  }
  :root[data-theme="dark"]{ --coco:#FFEFDA; --coco-2:#FFE0BA; }

  *{box-sizing:border-box}
  body{
    margin:0; font-family:var(--ui); color:var(--tinta);
    background:
      radial-gradient(circle at 10% 6%, rgba(255,198,26,.30), transparent 40%),
      radial-gradient(circle at 92% 2%, rgba(255,63,135,.18), transparent 36%),
      var(--coco);
    background-attachment:fixed; min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  button{font-family:inherit; color:inherit}
  :focus-visible{outline:4px solid var(--uva); outline-offset:3px}

  .cascara{display:grid; grid-template-columns:288px 1fr; min-height:100vh}

  .menu{
    background:var(--papel); border-right:5px solid var(--tinta);
    padding:14px 14px 40px; overflow-y:auto; position:sticky; top:0; height:100vh;
  }
  .logo{font-family:var(--display); font-weight:700; font-size:1.5rem; display:flex; align-items:center; gap:8px; margin:4px 0 14px}
  .logo b{background:var(--guayaba); color:#fff; border-radius:12px; padding:2px 10px; transform:rotate(-3deg); display:inline-block}

  .tablero{background:var(--coco-2); border:4px solid var(--tinta); border-radius:var(--r-l); padding:12px; margin-bottom:14px; text-align:center}
  .tablero .cuenta{font-family:var(--display); font-size:2.2rem; font-weight:700; line-height:1; font-variant-numeric:tabular-nums}
  .tablero .cuenta.late{animation:latido .5s}
  @keyframes latido{0%,100%{transform:scale(1)}40%{transform:scale(1.35)}}
  .tablero small{display:block; color:var(--tinta-suave); margin-top:2px}
  .vitrina{display:flex; flex-wrap:wrap; gap:5px; justify-content:center; margin-top:9px}
  .vitrina span{font-size:1.35rem; filter:grayscale(1); opacity:.28}
  .vitrina span.ganada{filter:none; opacity:1}

  .probar{
    width:100%; margin-bottom:14px; background:var(--mar); color:#fff;
    border:4px solid var(--tinta); border-radius:var(--r-m); padding:12px;
    font-family:var(--display); font-size:1.1rem; font-weight:700; cursor:pointer;
    box-shadow:var(--sombra-p);
  }
  .probar:active{transform:translateY(4px); box-shadow:none}

  .grupo{margin:0 0 8px}
  .cabezal{
    width:100%; display:flex; align-items:center; gap:9px; cursor:pointer;
    background:var(--papel); border:4px solid var(--tinta); border-radius:var(--r-m);
    padding:9px 10px; text-align:left; box-shadow:var(--sombra-p);
  }
  .cabezal .chapa{width:38px; height:38px; flex:none; border-radius:12px; color:#fff; display:grid; place-items:center; font-family:var(--display); font-weight:700; font-size:1.15rem; border:3px solid var(--tinta); transform:rotate(-4deg)}
  .cabezal .rotulo{flex:1; min-width:0}
  .cabezal .rotulo b{display:block; font-family:var(--display); font-size:1.05rem; line-height:1.15}
  .cabezal .rotulo small{color:var(--tinta-suave); font-size:.82rem}
  .cabezal .trofeo{font-size:1.2rem}
  .grupo.abierto .cabezal{background:var(--coco-2)}

  .subs{list-style:none; margin:6px 0 10px; padding:0 0 0 10px; display:none; gap:6px}
  .grupo.abierto .subs{display:grid}
  .subs button{width:100%; display:flex; align-items:center; gap:8px; cursor:pointer; background:var(--papel); border:3px solid var(--tinta); border-radius:13px; padding:8px 10px; font-size:.98rem; text-align:left}
  .subs button .icono{font-size:1.15rem}
  .subs button .listo{margin-left:auto; font-size:.95rem; opacity:0}
  .subs button.completa .listo{opacity:1}
  .subs button.activa{background:var(--acento); color:#fff}

  .ajuste{margin-top:18px; border-top:4px dotted var(--arena); padding-top:14px}
  .ajuste label{display:block; font-size:.85rem; color:var(--tinta-suave); margin-bottom:5px}
  .ajuste input, .ajuste select{width:100%; font-family:var(--ui); font-size:.95rem; padding:9px; border:3px solid var(--tinta); border-radius:12px; background:var(--papel)}
  .aviso{margin-top:10px; background:#FFF0F4; border:3px solid var(--no); border-radius:12px; padding:9px; font-size:.82rem; line-height:1.35}

  .escena{padding:20px 22px 60px; max-width:900px; width:100%}
  .abrir-menu{display:none}

  .encabezado{display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap}
  .encabezado h1{font-family:var(--display); font-size:clamp(1.5rem,4.4vw,2.1rem); margin:0; text-wrap:balance; line-height:1.1}
  .encabezado .pastilla{background:var(--acento); color:#fff; border:4px solid var(--tinta); border-radius:999px; padding:5px 15px; font-family:var(--display); font-weight:700}

  .lamina{background:var(--papel); border:5px solid var(--tinta); border-radius:var(--r-xl); padding:26px 20px 30px; box-shadow:var(--sombra); text-align:center}
  .lamina h2{font-family:var(--display); font-size:1.7rem; margin:0 0 4px; text-wrap:balance}
  .lamina .guia{margin:0 0 22px; color:var(--tinta-suave); font-size:1.05rem}

  .fila{display:flex; flex-wrap:wrap; gap:16px; justify-content:center}

  .letrota{font-family:var(--display); font-weight:700; font-size:clamp(7rem,30vw,13rem); line-height:.9; color:var(--acento); background:none; border:none; cursor:pointer; padding:0 8px; text-shadow:8px 8px 0 var(--coco-2); transition:transform .15s}
  .letrota:active{transform:scale(.93)}

  .ficha{border:5px solid var(--tinta); border-radius:var(--r-l); background:var(--papel); cursor:pointer; box-shadow:var(--sombra-p); transition:transform .12s; font-family:var(--display); font-weight:700}
  .ficha:active{transform:translateY(5px); box-shadow:none}
  .ficha.acierto{background:var(--ok); color:#fff}
  .ficha.fallo{background:var(--no); color:#fff}

  .silaba{min-width:120px; padding:24px 14px; font-size:2.8rem; color:#fff}
  .vocalota{min-width:150px; padding:14px 12px 16px; font-size:3.4rem}
  .vocalota .dibujo{font-size:4.6rem; display:block; line-height:1.1}
  .vocalota small{display:block; font-family:var(--ui); font-weight:400; font-size:1rem; color:var(--tinta-suave)}

  .palabrota{width:min(100%,270px); padding:16px 12px 20px; font-size:2rem}
  .palabrota .dibujo{font-size:clamp(5rem,20vw,7.5rem); display:block; line-height:1.15}
  .palabrota .silabeo{display:block; font-family:var(--ui); font-weight:400; font-size:1.05rem; color:var(--tinta-suave); margin-top:2px}

  /* ---------- TARJETA DE DECODIFICACIÓN ----------
     Jerarquía invertida a propósito: la sílaba es lo más grande de la tarjeta,
     la palabra va después, y el dibujo queda chico y apagado hasta que el niño
     decodifica. Así la imagen confirma la lectura en vez de reemplazarla. */
  .tarjeta{width:min(100%,320px); background:var(--papel); border:5px solid var(--tinta); border-radius:var(--r-l); box-shadow:var(--sombra-p); padding:18px 14px 16px; display:flex; flex-direction:column; align-items:center; gap:10px}

  .pista{display:flex; gap:10px; justify-content:center; align-items:center; transition:gap .45s cubic-bezier(.2,.8,.3,1)}
  .pista.fusion{gap:0}

  .sil{font-family:var(--display); font-weight:700; font-size:clamp(2.6rem,11vw,4rem); line-height:1;
       color:#fff; background:var(--tinta-suave); border:4px solid var(--tinta); border-radius:18px;
       padding:10px 16px; cursor:pointer; user-select:none;
       transition:transform .22s cubic-bezier(.2,.8,.3,1), box-shadow .22s, background .22s, filter .22s}
  .sil.activa{transform:translateY(-10px) scale(1.16); box-shadow:0 10px 0 var(--tinta); filter:saturate(1.3)}
  .sil.apagada{filter:grayscale(.55) brightness(1.08)}
  .pista.fusion .sil{border-radius:12px; transform:none; box-shadow:none}
  .pista.fusion .sil:not(:last-child){border-right-width:0; border-top-right-radius:0; border-bottom-right-radius:0}
  .pista.fusion .sil:not(:first-child){border-top-left-radius:0; border-bottom-left-radius:0}

  .armada{font-family:var(--display); font-weight:700; font-size:clamp(1.7rem,7vw,2.4rem); line-height:1.1;
          opacity:0; transform:scale(.8); transition:opacity .3s, transform .3s cubic-bezier(.2,1.5,.4,1)}
  .armada.viva{opacity:1; transform:scale(1)}

  .mini{font-size:2.8rem; line-height:1; opacity:.28; filter:grayscale(1);
        transition:opacity .4s, filter .4s, transform .4s cubic-bezier(.2,1.5,.4,1)}
  .mini.viva{opacity:1; filter:none; transform:scale(1.18)}

  .leer{border:4px solid var(--tinta); background:var(--acento); color:#fff; border-radius:var(--r-l);
        font-family:var(--display); font-weight:700; font-size:1.15rem; padding:10px 20px; cursor:pointer;
        box-shadow:var(--sombra-p)}
  .leer:active{transform:translateY(4px); box-shadow:none}
  .leer[disabled]{opacity:.5; cursor:default}

  /* ---------- FORMADOR: consonante + vocal = sílaba ---------- */
  .formador{display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap;
            min-height:130px; margin:6px 0 4px}
  .pieza{font-family:var(--display); font-weight:700; font-size:clamp(2.4rem,10vw,3.6rem); line-height:1;
         border:4px solid var(--tinta); border-radius:16px; padding:8px 16px; background:var(--papel)}
  .pieza.cons{color:var(--acento)}
  .pieza.voc{color:#fff; background:var(--tinta-suave); transition:transform .5s cubic-bezier(.2,.8,.3,1)}
  .pieza.voc.vuela{transform:translateX(-14px) scale(1.1)}
  /* en las inversas la vocal va a la izquierda, así que viaja hacia la derecha */
  .formador.inversa .pieza.voc.vuela{transform:translateX(14px) scale(1.1)}
  .pieza.res{color:#fff; background:var(--ok); opacity:0; transform:scale(.7);
             transition:opacity .3s, transform .35s cubic-bezier(.2,1.5,.4,1)}
  .pieza.res.viva{opacity:1; transform:scale(1)}
  .signo{font-family:var(--display); font-weight:700; font-size:2rem; color:var(--tinta-suave)}

  @media (prefers-reduced-motion: reduce){
    .sil,.armada,.mini,.pista,.pieza.voc,.pieza.res{transition-duration:.01ms}
  }

  .opcionota{width:min(100%,240px); padding:18px 10px}
  .opcionota .dibujo{font-size:clamp(5.5rem,22vw,8rem); display:block; line-height:1.1}
  .opcionota .nombre{display:block; font-size:1.5rem; margin-top:4px}

  .frase{display:block; width:100%; margin:10px auto 0; max-width:560px; background:var(--coco-2); border:4px solid var(--tinta); border-radius:var(--r-l); padding:16px 18px; font-family:var(--display); font-size:1.5rem; font-weight:700; cursor:pointer; box-shadow:var(--sombra-p)}
  .frase:active{transform:translateY(4px); box-shadow:none}

  .boton{border:5px solid var(--tinta); background:var(--papel); border-radius:var(--r-l); padding:14px 22px; font-size:1.15rem; font-weight:700; cursor:pointer; box-shadow:var(--sombra-p); transition:transform .12s}
  .boton:active{transform:translateY(5px); box-shadow:none}
  .boton-grande{background:var(--acento); color:#fff; font-family:var(--display); font-size:1.45rem; padding:18px 32px; border-radius:var(--r-xl)}
  .pieza-final{display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-top:26px}

  .marcador{display:flex; justify-content:center; gap:10px; margin-bottom:18px; font-size:1.7rem}
  .marcador i{opacity:.22; font-style:normal; transition:transform .25s, opacity .25s}
  .marcador i.gana{opacity:1; transform:scale(1.3) rotate(-8deg)}

  .pergamino{background:var(--limon); border:5px solid var(--tinta); border-radius:var(--r-l); padding:18px 20px; margin-bottom:20px; font-family:var(--display); font-size:1.35rem; font-weight:700; cursor:pointer; box-shadow:var(--sombra-p); text-wrap:balance}
  .pergamino small{display:block; font-family:var(--ui); font-weight:400; font-size:.95rem; margin-top:6px; opacity:.75}

  .cielo{position:relative; height:min(56vh,400px); overflow:hidden; border:5px solid var(--tinta); border-radius:var(--r-l); margin-bottom:14px; background:linear-gradient(180deg,#D9F4F8,#FFF8E9); touch-action:manipulation}
  .globo{position:absolute; width:96px; height:96px; border-radius:50%; display:grid; place-items:center; font-family:var(--display); font-weight:700; font-size:2rem; color:#fff; border:5px solid var(--tinta); cursor:pointer; box-shadow:inset -9px -11px 0 rgba(0,0,0,.13)}
  .globo.revienta{animation:revienta .28s forwards}
  @keyframes revienta{to{transform:scale(1.7); opacity:0}}

  .renglon{min-height:96px; display:flex; gap:12px; justify-content:center; align-items:center; flex-wrap:wrap; background:var(--coco-2); border:5px dashed var(--tinta); border-radius:var(--r-l); padding:12px; margin-bottom:18px}
  .renglon span{font-family:var(--display); font-size:2.4rem; font-weight:700; background:var(--papel); border:4px solid var(--tinta); border-radius:16px; padding:4px 16px}
  .renglon.vacio::after{content:"Toca la primera sílaba"; font-size:1rem; color:var(--tinta-suave)}

  .trofeote{font-size:8rem; display:block; line-height:1; animation:baila 1.4s ease-in-out infinite}
  @keyframes baila{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.06)}}

  .fiesta{position:fixed; inset:0; display:grid; place-items:center; z-index:60; pointer-events:none; opacity:0; transition:opacity .2s}
  .fiesta.viva{opacity:1}
  .fiesta div{background:var(--papel); border:6px solid var(--tinta); border-radius:var(--r-xl); padding:22px 34px; font-family:var(--display); font-size:2.1rem; font-weight:700; box-shadow:var(--sombra); text-align:center; animation:surge .45s}
  .fiesta div em{display:block; font-style:normal; font-size:4rem; line-height:1.1}
  @keyframes surge{0%{transform:scale(.4) rotate(-12deg)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
  .confeti{position:fixed; inset:0; pointer-events:none; z-index:55}

  .brinca{animation:brinca .5s}
  @keyframes brinca{0%,100%{transform:none}30%{transform:translateY(-18px) scale(1.06)}60%{transform:translateY(0) scale(.98)}}
  .tiembla{animation:tiembla .4s}
  @keyframes tiembla{0%,100%{transform:none}20%{transform:translateX(-10px) rotate(-3deg)}60%{transform:translateX(10px) rotate(3deg)}}

  .portada{
    position:fixed; inset:0; z-index:80; display:grid; place-items:center;
    background:var(--coco); padding:20px; text-align:center;
  }
  .portada.fuera{display:none}
  .portada .caja{max-width:520px}
  .portada h1{font-family:var(--display); font-size:clamp(2rem,7vw,3rem); margin:0 0 6px; text-wrap:balance}
  .portada p{font-size:1.15rem; color:var(--tinta-suave); margin:0 0 24px}
  .portada .arranca{
    background:var(--guayaba); color:#fff; border:6px solid var(--tinta); border-radius:var(--r-xl);
    padding:22px 40px; font-family:var(--display); font-size:1.9rem; font-weight:700;
    cursor:pointer; box-shadow:var(--sombra);
  }
  .portada .arranca:active{transform:translateY(5px)}
  .portada .letras{font-size:clamp(3rem,14vw,5.5rem); font-family:var(--display); font-weight:700; letter-spacing:.06em; margin-bottom:8px}
  .portada .letras span:nth-child(1){color:var(--guayaba)}
  .portada .letras span:nth-child(2){color:var(--mango)}
  .portada .letras span:nth-child(3){color:var(--mar)}
  .portada .letras span:nth-child(4){color:var(--hoja)}
  .portada .letras span:nth-child(5){color:var(--uva)}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important}
  }
  @media (max-width:900px){
    .cascara{grid-template-columns:1fr}
    .menu{position:fixed; top:0; left:0; bottom:0; width:290px; z-index:70; transform:translateX(-104%); transition:transform .25s; height:100vh; box-shadow:14px 0 40px rgba(58,35,80,.25)}
    body.menu-abierto .menu{transform:none}
    .abrir-menu{display:inline-flex; align-items:center; gap:8px; position:sticky; top:10px; z-index:20; background:var(--acento); color:#fff; border:5px solid var(--tinta); border-radius:999px; padding:10px 18px; font-family:var(--display); font-size:1.1rem; font-weight:700; cursor:pointer; box-shadow:var(--sombra-p); margin-bottom:12px}
    .velo{display:none; position:fixed; inset:0; background:rgba(58,35,80,.45); z-index:65}
    body.menu-abierto .velo{display:block}
    .escena{padding:14px 14px 60px}
  }
</style>

<canvas class="confeti" id="confeti" aria-hidden="true"></canvas>
<div class="fiesta" id="fiesta" aria-hidden="true"></div>
<div class="velo" id="velo"></div>

<div class="portada" id="portada">
  <div class="caja">
    <div class="letras"><span>a</span><span>e</span><span>i</span><span>o</span><span>u</span></div>
    <h1>Nacho Lee</h1>
    <p>Las 26 lecciones del Nacho, con voz, juegos y premios.</p>
    <button class="arranca" id="arranca" type="button">▶ ¡Empezar!</button>
  </div>
</div>

<div class="cascara">
  <nav class="menu" id="menu" aria-label="Lecciones">
    <div class="logo">Nacho <b>Lee</b></div>

    <div class="tablero">
      <div class="cuenta" id="cuenta">0</div>
      <small>estrellas ganadas</small>
      <div class="vitrina" id="vitrina"></div>
    </div>

    <button class="probar" id="probar" type="button">🔊 Probar el sonido</button>

    <div id="listaMenu"></div>

    <div class="ajuste">
      <label for="campoNombre">Nombre de la niña</label>
      <input id="campoNombre" type="text" maxlength="12" placeholder="Escribe tu nombre">
      <div id="avisoVoz"></div>
    </div>
  </nav>

  <main class="escena">
    <button class="abrir-menu" id="abrirMenu" type="button">☰ Lecciones</button>
    <div id="escenario"></div>
  </main>
</div>

<script>
(function(){
  "use strict";

  var CONTENIDO = /*__CONTENIDO__*/null;
  var AUDIO = /*__AUDIO__*/null;

  var LECCIONES = CONTENIDO.lecciones;
  var SECCIONES = [
    {id:"sonidos",  icono:"🔊", nombre:"Sonidos"},
    {id:"palabras", icono:"🔤", nombre:"Sílabas"},
    {id:"adivina",  icono:"🧩", nombre:"Adivinanzas"},
    {id:"juego",    icono:"🎮", nombre:"Juego"}
  ];
  var PALETA = ["#FF3F87","#FF8A24","#12B3C4","#38A85C","#8A5CF0","#FFC61A"];
  var ELOGIOS = ["¡Muy bien!","¡Excelente!","¡Lo lograste!","¡Qué inteligente!","¡Perfecto!","¡Wow, qué bien!"];

  /* ==========================================================
     ESTADO
     ========================================================== */
  var CLAVE = "nacho-lee-v3";
  var estado = (function(){
    try{
      var g = JSON.parse(localStorage.getItem(CLAVE) || "{}");
      return {nombre:g.nombre||"", estrellas:g.estrellas||0, hechas:g.hechas||{}, trofeos:g.trofeos||[]};
    }catch(e){ return {nombre:"", estrellas:0, hechas:{}, trofeos:[]}; }
  })();
  function guardar(){ try{ localStorage.setItem(CLAVE, JSON.stringify(estado)); }catch(e){} }
  function nombreNina(){ return estado.nombre || "campeona"; }

  var vista = {leccion:0, seccion:0};

  /* ==========================================================
     VOZ — clips MP3 grabados en español dominicano
     ========================================================== */
  var SILENCIO = "data:audio/mpeg;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQCA";
  var reproductor = new Audio();
  reproductor.preload = "auto";
  var cola = [], desbloqueado = false, hayFallo = false;

  function textoDe(clave){
    var corte = clave.indexOf(":");
    var tipo = clave.slice(0, corte), resto = clave.slice(corte + 1);
    if(tipo === "s" || tipo === "f" || tipo === "o" || tipo === "a") return resto;
    if(tipo === "v"){
      var vv = null;
      LECCIONES[0].vocales.forEach(function(v){ if(v.l === resto) vv = v; });
      return vv ? (vv.l + ", de " + vv.w) : resto;
    }
    if(tipo === "L"){
      // resto viene como "11:c": el número desambigua letras repetidas
      var corte2 = resto.indexOf(":"), num = resto.slice(0, corte2), LL = null;
      LECCIONES.forEach(function(L){ if(String(L.n) === num) LL = L; });
      return LL ? (LL.letra + ". " + LL.silabas.join(", ")) : resto.slice(corte2 + 1);
    }
    if(tipo === "p"){
      var pp = null;
      LECCIONES.forEach(function(L){ L.palabras.forEach(function(p){ if(p.w === resto) pp = p; }); });
      return pp ? (pp.s.replace(/-/g, " ") + ". " + pp.w) : resto;
    }
    return resto;
  }

  function respaldoVoz(claves){
    if(!window.speechSynthesis) return;
    try{
      window.speechSynthesis.cancel();
      var texto = claves.map(textoDe).join(". ");
      var u = new SpeechSynthesisUtterance(texto);
      var vs = window.speechSynthesis.getVoices() || [];
      var es = null;
      vs.forEach(function(v){ if(!es && (v.lang||"").toLowerCase().indexOf("es") === 0) es = v; });
      u.lang = es ? es.lang : "es-MX";
      if(es) u.voice = es;
      u.rate = .82; u.pitch = 1.1;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  /* Ganchos de sincronía: alClip(clave) al arrancar cada clip, alFinal() al
     vaciarse la cola. Con esto la animación de sílabas va pegada al audio real
     en vez de a un temporizador a ciegas. */
  var alClip = null, alFinal = null;

  function cerrarCola(){
    var f = alFinal; alClip = null; alFinal = null;
    if(f) f();
  }

  function siguienteClip(){
    if(!cola.length){ cerrarCola(); return; }
    var clave = cola.shift();
    var fuente = AUDIO[clave];
    if(!fuente){
      // clip que no se generó: respaldo con la voz del navegador
      if(alClip) alClip(clave);
      respaldoVoz([clave]);
      cola = [];
      // speechSynthesis no da un "ended" fiable: cerramos por tiempo estimado
      setTimeout(cerrarCola, 420 + textoDe(clave).length * 55);
      return;
    }
    if(alClip) alClip(clave);
    reproductor.src = fuente;
    var promesa = reproductor.play();
    if(promesa && promesa.catch){
      promesa.catch(function(){
        hayFallo = true;
        avisarSonido();
      });
    }
  }

  reproductor.addEventListener("ended", function(){ siguienteClip(); });
  reproductor.addEventListener("error", function(){ cola = []; cerrarCola(); });

  function hablar(){
    var claves = Array.prototype.slice.call(arguments).filter(Boolean);
    cola = claves;
    alClip = null; alFinal = null;
    try{ reproductor.pause(); }catch(e){}
    siguienteClip();
  }

  /* Igual que hablar(), pero avisando sílaba por sílaba.
     claves: array de claves de audio. cada: function(clave, indice). fin: function(). */
  function hablarGuiado(claves, cada, fin){
    cola = claves.filter(Boolean);
    var i = -1;
    alClip = function(clave){ i++; if(cada) cada(clave, i); };
    alFinal = fin || null;
    try{ reproductor.pause(); }catch(e){}
    siguienteClip();
  }

  function callar(){ cola = []; alClip = null; alFinal = null; try{ reproductor.pause(); }catch(e){} }

  function desbloquear(){
    if(desbloqueado) return;
    desbloqueado = true;
    reproductor.src = SILENCIO;
    var p = reproductor.play();
    if(p && p.catch) p.catch(function(){});
    audio();
  }

  function avisarSonido(){
    var caja = document.getElementById("avisoVoz");
    while(caja.firstChild) caja.removeChild(caja.firstChild);
    var d = document.createElement("div");
    d.className = "aviso";
    d.textContent = "El navegador bloqueó el sonido. Toca el botón «Probar el sonido» y sube el volumen del equipo.";
    caja.appendChild(d);
  }

  /* ==========================================================
     EFECTOS DE SONIDO
     ========================================================== */
  var ctx = null;
  function audio(){
    if(!ctx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(AC) ctx = new AC();
    }
    if(ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function nota(f, cuando, dur, tipo, vol){
    var a = audio(); if(!a) return;
    var o = a.createOscillator(), g = a.createGain();
    o.type = tipo || "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0, a.currentTime + cuando);
    g.gain.linearRampToValueAtTime(vol || .2, a.currentTime + cuando + .02);
    g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + cuando + dur);
    o.connect(g); g.connect(a.destination);
    o.start(a.currentTime + cuando); o.stop(a.currentTime + cuando + dur + .05);
  }
  var RUIDOS = {
    toque:  function(){ nota(660,0,.12,"triangle",.15); },
    pop:    function(){ nota(880,0,.08,"square",.11); nota(1320,.04,.1,"sine",.09); },
    bien:   function(){ [523,659,784,1047].forEach(function(f,i){ nota(f,i*.08,.32,"triangle",.19); }); },
    ups:    function(){ nota(300,0,.18,"sawtooth",.11); nota(220,.12,.22,"sawtooth",.09); },
    fiesta: function(){ [523,659,784,1047,1319,1047,1319,1568].forEach(function(f,i){ nota(f,i*.1,.5,"triangle",.21); }); }
  };

  /* ==========================================================
     CONFETI Y CELEBRACIÓN
     ========================================================== */
  var lienzo = document.getElementById("confeti");
  var pincel = lienzo.getContext("2d");
  var papelitos = [];
  var quieto = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function ajustar(){ lienzo.width = window.innerWidth; lienzo.height = window.innerHeight; }
  ajustar(); window.addEventListener("resize", ajustar);

  function confeti(cuantos){
    if(quieto) return;
    for(var i=0;i<(cuantos||90);i++){
      papelitos.push({
        x:Math.random()*lienzo.width, y:-20-Math.random()*lienzo.height*.4,
        vx:(Math.random()-.5)*2.4, vy:2+Math.random()*3.4,
        g:Math.random()*Math.PI, vg:(Math.random()-.5)*.25,
        w:9+Math.random()*9, h:11+Math.random()*11,
        c:PALETA[(Math.random()*PALETA.length)|0]
      });
    }
  }
  (function pintar(){
    pincel.clearRect(0,0,lienzo.width,lienzo.height);
    for(var i=papelitos.length-1;i>=0;i--){
      var p = papelitos[i];
      p.x+=p.vx; p.y+=p.vy; p.g+=p.vg; p.vy+=.02;
      if(p.y > lienzo.height+40){ papelitos.splice(i,1); continue; }
      pincel.save(); pincel.translate(p.x,p.y); pincel.rotate(p.g);
      pincel.fillStyle = p.c; pincel.fillRect(-p.w/2,-p.h/2,p.w,p.h); pincel.restore();
    }
    requestAnimationFrame(pintar);
  })();

  var cajaFiesta = document.getElementById("fiesta");
  var relojFiesta = null;
  function celebrar(icono, texto){
    while(cajaFiesta.firstChild) cajaFiesta.removeChild(cajaFiesta.firstChild);
    var d = document.createElement("div");
    var em = document.createElement("em"); em.textContent = icono;
    d.appendChild(em); d.appendChild(document.createTextNode(texto));
    cajaFiesta.appendChild(d);
    cajaFiesta.classList.add("viva");
    clearTimeout(relojFiesta);
    relojFiesta = setTimeout(function(){ cajaFiesta.classList.remove("viva"); }, 1100);
  }

  var cuenta = document.getElementById("cuenta");
  function ganarEstrella(){
    estado.estrellas++; guardar();
    cuenta.textContent = estado.estrellas;
    cuenta.classList.remove("late"); void cuenta.offsetWidth; cuenta.classList.add("late");
  }
  function premiar(mensaje, decirlo){
    RUIDOS.bien(); ganarEstrella(); confeti(30);
    var elogio = ELOGIOS[(Math.random()*ELOGIOS.length)|0];
    celebrar("⭐", mensaje || elogio);
    if(decirlo !== false) hablar("f:" + elogio);
  }

  /* ==========================================================
     HERRAMIENTAS
     ========================================================== */
  var escenario = document.getElementById("escenario");
  var listaMenu = document.getElementById("listaMenu");
  var vitrina = document.getElementById("vitrina");

  function el(t,c,x){ var n=document.createElement(t); if(c) n.className=c; if(x!=null) n.textContent=x; return n; }
  function vaciar(n){ while(n.firstChild) n.removeChild(n.firstChild); }
  function revolver(a){
    var b=a.slice();
    for(var i=b.length-1;i>0;i--){ var j=(Math.random()*(i+1))|0; var t=b[i]; b[i]=b[j]; b[j]=t; }
    return b;
  }
  function brinca(n){ n.classList.remove("brinca"); void n.offsetWidth; n.classList.add("brinca"); }
  function llave(li,si){ return li + "-" + si; }
  function marcarHecha(){
    var k = llave(vista.leccion, vista.seccion);
    if(!estado.hechas[k]){ estado.hechas[k] = true; guardar(); }
    var L = LECCIONES[vista.leccion];
    var completa = SECCIONES.every(function(_,i){ return estado.hechas[llave(vista.leccion,i)]; });
    if(completa && estado.trofeos.indexOf(L.n) < 0){ estado.trofeos.push(L.n); guardar(); }
    pintarMenu();
    return completa;
  }

  /* ==========================================================
     MENÚ

  function pintarMenu(){
    vaciar(listaMenu);
    LECCIONES.forEach(function(L, li){
      var grupo = el("div","grupo" + (li === vista.leccion ? " abierto" : ""));

        b.type = "button";
        b.appendChild(el("span","icono", S.icono));

      });

    vaciar(vitrina);

  document.getElementById("abrirMenu").addEventListener("click", function(){
    document.body.classList.toggle("menu-abierto");
  });
  document.getElementById("velo").addEventListener("click", function(){
    document.body.classList.remove("menu-abierto");
  });

    hablar("f:Hola, vamos a leer.");
  });

  var campoNombre = document.getElementById("campoNombre");
  campoNombre.value = estado.nombre;
  campoNombre.addEventListener("change", function(){
    estado.nombre = campoNombre.value.trim().slice(0,12);

  /* ==========================================================
     NAVEGACIÓN
     ========================================================== */
  function ir(li, si){
    pararJuego();
    vista.leccion = li; vista.seccion = si;
    document.body.classList.remove("menu-abierto");
    document.documentElement.style.setProperty("--acento", LECCIONES[li].color);
    pintarMenu(); dibujar();
    window.scrollTo(0,0);
  }
  function siguiente(){
    if(vista.seccion < SECCIONES.length - 1) ir(vista.leccion, vista.seccion + 1);
    else if(vista.leccion < LECCIONES.length - 1) ir(vista.leccion + 1, 0);
    else ir(0,0);
  }
  function botonSigue(texto){
    var caja = el("div","pieza-final");
    var b = el("button","boton boton-grande", texto || "Siguiente ▶");
    b.addEventListener("click", function(){ RUIDOS.toque(); siguiente(); });
    caja.appendChild(b);
    return caja;
  }
  function encabezado(L, S){
    var h = el("div","encabezado");
    h.appendChild(el("div","pastilla","Lección " + L.n));
    h.appendChild(el("h1", null, S.icono + " " + S.nombre + " · " + L.titulo));

  function dibujar(){
    var L = LECCIONES[vista.leccion], S = SECCIONES[vista.seccion];
    vaciar(escenario);
    escenario.appendChild(encabezado(L,S));
    var lamina = el("div","lamina");
    escenario.appendChild(lamina);
    if(S.id === "sonidos")  secSonidos(L, lamina);
    if(S.id === "palabras") secPalabras(L, lamina);
    if(S.id === "adivina")  secAdivina(L, lamina);
    if(S.id === "juego")    secJuego(L, lamina);
  }

  /* ---------- 1. SONIDOS ---------- */
  function secSonidos(L, t){
    if(L.vocales){
      t.appendChild(el("h2", null, "Las cinco vocales"));
      t.appendChild(el("p","guia","Toca cada vocal para escuchar su sonido."));
      var r = el("div","fila");
      L.vocales.forEach(function(v,i){
        var f = el("button","ficha vocalota"); f.type = "button";
        f.style.color = PALETA[i % PALETA.length];
        f.appendChild(el("span","dibujo", v.e));
        f.appendChild(document.createTextNode(v.l + " " + v.l.toUpperCase()));
        f.appendChild(el("small", null, v.w));
        f.addEventListener("click", function(){ RUIDOS.pop(); brinca(f); hablar("v:" + v.l); });
        r.appendChild(f);
      });
      t.appendChild(r);
    } else {
      t.appendChild(el("h2", null, L.titulo));
      t.appendChild(el("p","guia","Toca una sílaba y mira cómo la letra y la vocal se juntan."));
      var g = el("button","letrota"); g.type = "button";
      g.textContent = L.letra + " " + L.letra.toUpperCase();
      g.setAttribute("aria-label","Escuchar la letra " + L.letra);
      g.addEventListener("click", function(){ RUIDOS.pop(); brinca(g); hablar("L:" + L.n + ":" + L.letra); });
      t.appendChild(g);

      /* Formador: enseña CÓMO nace la sílaba (m + a = ma). Es el corazón del
         método silábico. Antes la sílaba aparecía ya hecha, sin mostrar la
         síntesis, que es justo la operación que el niño tiene que aprender. */
      var forma  = el("div", L.inversa ? "formador inversa" : "formador");
      var cons   = el("b","pieza cons", L.letra);
      var voc    = el("b","pieza voc","a");
      var res    = el("b","pieza res", L.silabas[0]);

      /* En las sílabas inversas (al, es, ar...) la vocal va primero y la
         consonante cierra. Se invierte el orden del formador para que la
         animación muestre la síntesis real: a + l = al, no l + a. */
      if(L.inversa){
        forma.appendChild(voc);
        forma.appendChild(el("span","signo","+"));
        forma.appendChild(cons);
      } else {
        forma.appendChild(cons);
        forma.appendChild(el("span","signo","+"));
        forma.appendChild(voc);
      }
      forma.appendChild(el("span","signo","="));
      forma.appendChild(res);
      t.appendChild(forma);

      function vocalDe(s){
        return L.inversa
          ? s.slice(0, s.length - L.letra.length)
          : s.slice(L.letra.length) || s.slice(-1);
      }

      function formar(s){
        voc.textContent = vocalDe(s);
        res.textContent = s;
        voc.classList.remove("vuela"); res.classList.remove("viva");
        void voc.offsetWidth;                 // reinicia la animación
        voc.classList.add("vuela");
        setTimeout(function(){ res.classList.add("viva"); }, 480);
        hablar("x:" + s);
      }
      voc.textContent = vocalDe(L.silabas[0]);

      var r2 = el("div","fila"); r2.style.marginTop = "18px";
      L.silabas.forEach(function(s,i){
        var f = el("button","ficha silaba", s); f.type = "button";
        f.style.background = PALETA[i % PALETA.length];
        f.addEventListener("click", function(){ RUIDOS.pop(); brinca(f); formar(s); });
        r2.appendChild(f);
      });
      t.appendChild(r2);
    }

    var todas = el("button","boton","🔊 Escuchar todo");
    todas.style.marginTop = "22px";
    todas.addEventListener("click", function(){
      RUIDOS.toque();
      if(L.silabas) hablar("L:" + L.n + ":" + L.letra); else hablar("f:a, e, i, o, u");
    });
    t.appendChild(todas);

    var caja = el("div","pieza-final");
    var b = el("button","boton boton-grande","¡Ya escuché! ▶");
    b.addEventListener("click", function(){
      premiar("¡Escuchaste muy bien!", false);
      hablar("f:¡Escuchaste muy bien!");
      marcarHecha();
      setTimeout(siguiente, 1100);
    });
    caja.appendChild(b);
    t.appendChild(caja);
  }

  /* ---------- 2. LEER POR SÍLABAS ----------
     Antes: dibujo gigante, palabra mediana y el silabeo en gris chiquito debajo.
     El niño miraba el dibujo y adivinaba la palabra sin decodificar nada.
     Ahora la sílaba es la protagonista: se encienden una por una al ritmo del
     audio real, luego se juntan (fusión) para formar la palabra, y el dibujo
     recién se destapa al final, como confirmación de la lectura. */
  function secPalabras(L, t){
    t.appendChild(el("h2", null, "Lee por sílabas"));
    t.appendChild(el("p","guia","Toca 🔊 y sigue las sílabas que se encienden. Al final se juntan y forman la palabra."));

    var vistos = {}, r = el("div","fila"), lectorActivo = null;

    L.palabras.forEach(function(p){
      var silabas = p.s.split("-");
      var tarjeta = el("article","tarjeta");

      var pista = el("div","pista");
      var chips = silabas.map(function(s,i){
        var c = el("b","sil apagada", s);
        c.style.background = PALETA[i % PALETA.length];
        c.addEventListener("click", function(){
          RUIDOS.pop(); brinca(c); hablar("s:" + s.toLowerCase());
        });
        pista.appendChild(c);
        return c;
      });
      tarjeta.appendChild(pista);

      var armada = el("div","armada", p.w);
      var mini = el("span","mini", p.e);
      var boton = el("button","leer","🔊 Leer"); boton.type = "button";
      tarjeta.appendChild(armada);
      tarjeta.appendChild(mini);
      tarjeta.appendChild(boton);

      function reset(){
        pista.classList.remove("fusion");
        armada.classList.remove("viva");
        mini.classList.remove("viva");
        chips.forEach(function(c){ c.classList.remove("activa"); c.classList.add("apagada"); });
        boton.disabled = false;
      }

      boton.addEventListener("click", function(){
        RUIDOS.toque();
        if(lectorActivo) lectorActivo();      // corta una lectura anterior a medias
        reset();
        lectorActivo = reset;
        boton.disabled = true;

        var claves = silabas.map(function(s){ return "s:" + s.toLowerCase(); });
        claves.push("w:" + p.w);              // la palabra entera cierra la secuencia

        hablarGuiado(claves, function(clave, i){
          chips.forEach(function(c){ c.classList.remove("activa"); });
          if(i < chips.length){
            chips[i].classList.remove("apagada");
            chips[i].classList.add("activa");
          } else {
            chips.forEach(function(c){ c.classList.remove("apagada"); });
            pista.classList.add("fusion");
            armada.classList.add("viva");
          }
        }, function(){
          lectorActivo = null;
          chips.forEach(function(c){ c.classList.remove("activa"); });
          mini.classList.add("viva");
          boton.disabled = false;
          if(!vistos[p.w]){
            vistos[p.w] = true;
            if(Object.keys(vistos).length === L.palabras.length){
              setTimeout(function(){ premiar("¡Leíste todas las palabras!", false); }, 700);
            }
          }
        });
      });

      r.appendChild(tarjeta);
    });
    t.appendChild(r);

    if(L.frases && L.frases.length){
      var titulo = el("h2", null, "Lee las oraciones");
      titulo.style.marginTop = "28px";
      t.appendChild(titulo);
      L.frases.forEach(function(o){
        var b = el("button","frase","🔊 " + o); b.type = "button";
        b.addEventListener("click", function(){ RUIDOS.toque(); hablar("o:" + o); });
        t.appendChild(b);
      });
    }

    var caja = el("div","pieza-final");
    var b2 = el("button","boton boton-grande","¡Ya leí! ▶");
    b2.addEventListener("click", function(){
      premiar("¡Muy buena lectura!", false);
      hablar("f:¡Muy buena lectura!");
      marcarHecha();
      setTimeout(siguiente, 1100);
    });
    caja.appendChild(b2);
    t.appendChild(caja);
  }

  /* ---------- 3. ADIVINANZAS ---------- */
  function secAdivina(L, t){
    t.appendChild(el("h2", null, "Escucha y adivina"));
    t.appendChild(el("p","guia","Oye la adivinanza y toca el dibujo correcto."));

    var marcador = el("div","marcador");
    L.adivinanzas.forEach(function(){ marcador.appendChild(el("i", null, "⭐")); });
    t.appendChild(marcador);

    var pergamino = el("div","pergamino");
    pergamino.setAttribute("role","button"); pergamino.tabIndex = 0;
    t.appendChild(pergamino);
    var zona = el("div","fila"); t.appendChild(zona);

    var idx = 0;
    function leer(){ hablar("a:" + L.adivinanzas[idx].texto); }
    pergamino.addEventListener("click", function(){ RUIDOS.toque(); leer(); });
    pergamino.addEventListener("keydown", function(e){
      if(e.key === "Enter" || e.key === " "){ e.preventDefault(); leer(); }
    });

    function nombreDe(emoji){
      var todas = [];
      LECCIONES.forEach(function(o){ todas = todas.concat(o.palabras); });
      for(var i=0;i<todas.length;i++) if(todas[i].e === emoji) return todas[i].w;
      return "";
    }

    function ronda(){
      var a = L.adivinanzas[idx];
      vaciar(pergamino); vaciar(zona);
      pergamino.appendChild(document.createTextNode(a.texto));
      pergamino.appendChild(el("small", null, "Toca aquí para volver a escuchar 🔊"));
      revolver(a.opciones).forEach(function(op){
        var f = el("button","ficha opcionota"); f.type = "button";
        f.appendChild(el("span","dibujo", op));
        f.appendChild(el("span","nombre", nombreDe(op)));
        f.addEventListener("click", function(){ responder(f, op, a); });
        zona.appendChild(f);
      });
      espera(leer, 450);
    }

    function responder(f, op, a){
      if(op === a.resp){
        f.classList.add("acierto"); brinca(f);
        premiar("¡Adivinaste!", false);
        hablar("f:¡Adivinaste!");
        marcador.children[idx].classList.add("gana");
        idx++;
        espera(function(){ if(idx >= L.adivinanzas.length) terminar(); else ronda(); }, 1400);
      } else {
        f.classList.add("fallo","tiembla"); RUIDOS.ups();
        hablar("f:¡Casi! Escucha otra vez.");
        espera(function(){ f.classList.remove("fallo","tiembla"); }, 750);
      }
    }

    function terminar(){
      vaciar(pergamino); vaciar(zona);
      pergamino.textContent = "¡Adivinaste todas las adivinanzas!";
      RUIDOS.fiesta(); confeti(120);
      celebrar("🎉","¡Bravo, " + nombreNina() + "!");
      hablar("f:¡Adivinaste todas!");
      marcarHecha();
      zona.appendChild(botonSigue("¡A jugar! ▶"));
    }

    ronda();
  }

  /* ==========================================================
     4. JUEGOS
     ========================================================== */
  var META = 5;
  var relojes = [];
  function espera(fn, ms){ var id = setTimeout(fn, ms); relojes.push(id); return id; }
  function pararJuego(){
    relojes.forEach(function(id){ clearTimeout(id); clearInterval(id); });
    relojes = [];
    callar();
  }
  function marcadorNuevo(t){
    var m = el("div","marcador");
    for(var i=0;i<META;i++) m.appendChild(el("i", null, "⭐"));
    t.appendChild(m);
    return m;
  }
  function marcar(m, n){ for(var i=0;i<m.children.length;i++) if(i < n) m.children[i].classList.add("gana"); }

  function secJuego(L, t){
    pararJuego();
    if(L.juego === "escucha")  juegoEscucha(L, t);
    if(L.juego === "imagen")   juegoImagen(L, t);
    if(L.juego === "burbujas") juegoBurbujas(L, t);
    if(L.juego === "arma")     juegoArma(L, t);
  }

  function ganarJuego(L, t){
    pararJuego();
    RUIDOS.fiesta(); confeti(180);
    var completa = marcarHecha();
    vaciar(t);
    t.appendChild(el("span","trofeote", L.trofeo));
    t.appendChild(el("h2", null, "¡Lo hiciste, " + nombreNina() + "!"));
    t.appendChild(el("p","guia", completa
      ? "Terminaste toda la lección " + L.n + ": " + L.titulo
      : "Ganaste el juego de la lección " + L.n));
    var v = el("div","fila");
    LECCIONES.forEach(function(o){
      var s = el("div", null, estado.trofeos.indexOf(o.n) >= 0 ? o.trofeo : "⬜");
      s.style.fontSize = "2.4rem"; v.appendChild(s);
    });
    t.appendChild(v);
    celebrar("🏆","¡Campeona!");
    hablar("f:¡Lo hiciste muy bien! Ganaste un trofeo.");

    var caja = el("div","pieza-final");
    var otra = el("button","boton","🔁 Jugar otra vez");
    otra.addEventListener("click", function(){ RUIDOS.toque(); dibujar(); });
    caja.appendChild(otra);
    var sig = el("button","boton boton-grande", vista.leccion < LECCIONES.length-1 ? "Lección " + (L.n+1) + " ▶" : "🏠 Empezar de nuevo");
    sig.addEventListener("click", function(){ RUIDOS.toque(); siguiente(); });
    caja.appendChild(sig);
    t.appendChild(caja);
  }

  /* ---- A: escucha y toca ---- */
  function juegoEscucha(L, t){
    var banco = L.vocales ? L.vocales.map(function(v){ return v.l; }) : L.silabas;
    t.appendChild(el("h2", null, "Escucha y toca"));
    t.appendChild(el("p","guia","Oye el sonido y toca la ficha correcta."));
    var m = marcadorNuevo(t);
    var zona = el("div","fila"); t.appendChild(zona);
    var repetir = el("button","boton","🔊 Repetir");
    repetir.style.marginTop = "20px"; t.appendChild(repetir);

    var puntos = 0, objetivo = null;
    function ronda(){
      vaciar(zona);
      var ops = revolver(banco).slice(0,4);
      objetivo = ops[(Math.random()*ops.length)|0];
      ops.forEach(function(s,i){
        var f = el("button","ficha silaba", s); f.type = "button";
        f.style.background = PALETA[i % PALETA.length];
        f.addEventListener("click", function(){ responder(f,s); });
        zona.appendChild(f);
      });
      espera(function(){ hablar("f:Toca la","s:" + objetivo); }, 450);
    }
    function responder(f,s){
      if(s === objetivo){
        f.classList.add("acierto"); f.style.background = "";
        brinca(f); premiar();
        puntos++; marcar(m,puntos);
        if(puntos >= META) espera(function(){ ganarJuego(L,t); }, 1200);
        else espera(ronda, 1300);
      } else {
        f.classList.add("fallo","tiembla"); f.style.background = "";
        RUIDOS.ups();
        hablar("f:Otra vez, busca la","s:" + objetivo);
        espera(function(){
          f.classList.remove("fallo","tiembla");
          f.style.background = PALETA[(Math.random()*PALETA.length)|0];
        }, 700);
      }
    }
    repetir.addEventListener("click", function(){ if(objetivo) hablar("s:" + objetivo); });
    ronda();
  }

  /* ---- B: ¿cuál empieza así? ---- */
  function juegoImagen(L, t){
    var otras = [];
    LECCIONES.forEach(function(o){ if(o.n !== L.n) otras = otras.concat(o.palabras); });

    t.appendChild(el("h2", null, "¿Cuál empieza así?"));
    t.appendChild(el("p","guia","Mira la sílaba y toca el dibujo que empieza con ella."));
    var m = marcadorNuevo(t);
    var lema = el("div","renglon"); t.appendChild(lema);
    var zona = el("div","fila"); t.appendChild(zona);
    var puntos = 0;

    function ronda(){
      vaciar(lema); vaciar(zona);
      var buena = L.palabras[(Math.random()*L.palabras.length)|0];
      var pri = buena.s.split("-")[0].toLowerCase();
      lema.appendChild(el("span", null, pri));
      var malas = revolver(otras).filter(function(p){
        return p.s.split("-")[0].toLowerCase() !== pri;
      }).slice(0,2);
      revolver([buena].concat(malas)).forEach(function(p){
        var f = el("button","ficha opcionota"); f.type = "button";
        f.appendChild(el("span","dibujo", p.e));
        f.appendChild(el("span","nombre", p.w));
        f.addEventListener("click", function(){ responder(f,p,buena,pri); });
        zona.appendChild(f);
      });
      espera(function(){ hablar("f:¿Cuál empieza con","s:" + pri); }, 400);
    }
    function responder(f,p,buena,pri){
      if(p.w === buena.w){
        f.classList.add("acierto"); brinca(f);
        premiar("¡Sí! " + p.w, false);
        hablar("f:¡Sí!","p:" + p.w);
        puntos++; marcar(m,puntos);
        espera(function(){ if(puntos >= META) ganarJuego(L,t); else ronda(); }, 1600);
      } else {
        f.classList.add("fallo","tiembla"); RUIDOS.ups();
        hablar("f:Eso es","p:" + p.w,"f:Busca","s:" + pri);
        espera(function(){ f.classList.remove("fallo","tiembla"); }, 800);
      }
    }
    ronda();
  }

  /* ---- C: revienta la sílaba ---- */
  function juegoBurbujas(L, t){
    t.appendChild(el("h2", null, "Revienta la sílaba"));
    t.appendChild(el("p","guia","Toca solo las burbujas que dicen la sílaba de arriba."));
    var m = marcadorNuevo(t);
    var lema = el("div","renglon"); t.appendChild(lema);
    var cielo = el("div","cielo"); t.appendChild(cielo);

    var objetivo = L.silabas[(Math.random()*L.silabas.length)|0];
    lema.appendChild(el("span", null, objetivo));
    espera(function(){ hablar("f:Revienta las burbujas que dicen","s:" + objetivo); }, 450);

    var distractores = [];
    LECCIONES.forEach(function(o){ if(o.silabas) distractores = distractores.concat(o.silabas); });
    distractores = distractores.filter(function(s){ return s !== objetivo; });

    var globos = [], puntos = 0, vivo = true;

    function nacer(){
      if(!vivo) return;
      var buena = Math.random() < .48;
      var texto = buena ? objetivo : distractores[(Math.random()*distractores.length)|0];
      var g = el("button","globo", texto); g.type = "button";
      g.style.background = PALETA[(Math.random()*PALETA.length)|0];
      var ancho = cielo.clientWidth || 320;
      var x = 8 + Math.random()*Math.max(10, ancho - 112);
      var y = (cielo.clientHeight || 360) + 12;
      g.style.left = x + "px"; g.style.top = y + "px";
      var b = {el:g, y:y, vy: quieto ? .5 : (.8 + Math.random()*.8), ok: texto === objetivo, muerto:false};
      g.addEventListener("click", function(){ pinchar(b); });
      cielo.appendChild(g); globos.push(b);
    }
    function pinchar(b){
      if(b.muerto) return;
      if(b.ok){
        b.muerto = true; b.el.classList.add("revienta");
        premiar(null, false); hablar("s:" + objetivo);
        puntos++; marcar(m,puntos);
        if(puntos >= META){ vivo = false; espera(function(){ ganarJuego(L,t); }, 900); }
      } else {
        RUIDOS.ups(); b.el.classList.add("tiembla");
        espera(function(){ b.el.classList.remove("tiembla"); }, 420);
      }
    }
    function quitar(b, ms){ espera(function(){ if(b.el.parentNode) b.el.parentNode.removeChild(b.el); }, ms); }
    function volar(){
      if(!vivo) return;
      for(var i=globos.length-1;i>=0;i--){
        var b = globos[i];
        if(b.muerto){ quitar(b,300); globos.splice(i,1); continue; }
        b.y -= b.vy; b.el.style.top = b.y + "px";
        if(b.y < -120){ quitar(b,0); globos.splice(i,1); }
      }
      requestAnimationFrame(volar);
    }
    relojes.push(setInterval(nacer, 850));
    nacer();
    requestAnimationFrame(volar);
  }

  /* ---- D: arma la palabra ---- */
  function juegoArma(L, t){
    t.appendChild(el("h2", null, "Arma la palabra"));
    t.appendChild(el("p","guia","Toca las sílabas en orden para formar la palabra del dibujo."));
    var m = marcadorNuevo(t);
    var dibujo = el("div","trofeote"); dibujo.style.animation = "none";
    t.appendChild(dibujo);
    var renglon = el("div","renglon vacio"); t.appendChild(renglon);
    var zona = el("div","fila"); t.appendChild(zona);

    var meta = Math.min(META, L.palabras.length);
    var puntos = 0, actual = null, hechas = [];

    function ronda(){
      vaciar(renglon); vaciar(zona);
      renglon.classList.add("vacio"); hechas = [];
      actual = L.palabras[puntos % L.palabras.length];
      dibujo.textContent = actual.e;
      var trozos = actual.s.split("-");
      revolver(trozos).forEach(function(s,i){
        var f = el("button","ficha silaba", s.toLowerCase()); f.type = "button";
        f.style.background = PALETA[i % PALETA.length];
        f.addEventListener("click", function(){ poner(f, s, trozos); });
        zona.appendChild(f);
      });
      espera(function(){ hablar("f:Arma la palabra","p:" + actual.w); }, 400);
    }
    function poner(f, s, trozos){
      var toca = trozos[hechas.length];
      if(toca && s.toLowerCase() === toca.toLowerCase()){
        hechas.push(s);
        renglon.classList.remove("vacio");
        renglon.appendChild(el("span", null, s.toLowerCase()));
        f.disabled = true; f.style.opacity = ".22";
        RUIDOS.pop();
        if(hechas.length === trozos.length){
          premiar("¡" + actual.w + "!", false);
          hablar("p:" + actual.w);
          puntos++; marcar(m, Math.min(puntos, META));
          espera(function(){ if(puntos >= meta) ganarJuego(L,t); else ronda(); }, 1700);
        } else {
          hablar("s:" + s.toLowerCase());
        }
      } else {
        RUIDOS.ups(); f.classList.add("tiembla");
        espera(function(){ f.classList.remove("tiembla"); }, 420);
      }
    }
    ronda();
  }

  /* ==========================================================
     ARRANQUE
     ========================================================== */
  var portada = document.getElementById("portada");
  document.getElementById("arranca").addEventListener("click", function(){
    desbloquear();
    portada.classList.add("fuera");
    RUIDOS.bien();
    hablar("f:Hola, vamos a leer.");
  });
  document.addEventListener("pointerdown", desbloquear, {once:true});

  document.documentElement.style.setProperty("--acento", LECCIONES[0].color);
  pintarMenu();
  dibujar();
})();
</script>
